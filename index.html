<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Google Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background: #080b18;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .5;
      animation: float 7s infinite alternate ease-in-out;
    }

    body::before {
      background: #6c2cff;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #00c8ff;
      right: -100px;
      bottom: -100px;
      animation-delay: 2s;
    }

    @keyframes float {
      to {
        transform: translate(80px, 50px) scale(1.2);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 380px;
      padding: 35px 25px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 25px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 40px rgba(0,0,0,.35);
      animation: cardIn .8s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #c8c8d8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(255,255,255,.5);
    }

    #userBox {
      display: none;
      margin-top: 20px;
    }

    #userPhoto {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 3px solid white;
      object-fit: cover;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      color: #ffd166;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Welcome 👋</h1>
    <p>Sign in to continue</p>

    <button id="loginBtn">🔐 Sign in with Google</button>

    <div id="userBox">
      <img id="userPhoto" src="" alt="Profile">
      <h3 id="userName"></h3>
      <p id="userEmail"></p>
      <button id="logoutBtn">🚪 Sign out</button>
    </div>

    <div id="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Firebase Console se apna config yahan paste karo
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userBox = document.getElementById("userBox");
    const message = document.getElementById("message");

    loginBtn.onclick = async () => {
      message.textContent = "Google login open ho raha hai...";

      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        message.textContent = error.message;
        console.error(error);
      }
    };

    logoutBtn.onclick = async () => {
      await signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        userBox.style.display = "block";

        document.getElementById("userName").textContent =
          user.displayName || "Google User";

        document.getElementById("userEmail").textContent =
          user.email || "";

        document.getElementById("userPhoto").src =
          user.photoURL || "";

        message.textContent = "Login successful ✅";
      } else {
        loginBtn.style.display = "block";
        userBox.style.display = "none";
        message.textContent = "";
      }
    });
  </script>

</body>
</html>
